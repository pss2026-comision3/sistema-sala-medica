  /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
     Put this @layer first; product CSS outside the layer always wins. */
  @layer od-layout {
    :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

    /* containers */
    .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
    .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
    .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
    .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
    .od-fill    { flex: 1 1 0; min-width: 0; }
    .od-fixed   { flex: none; }
    .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

    /* stacked information: each piece is its own line — never sibling inline spans */
    .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
    :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
    .od-tile { display: grid; grid-template-rows: auto 1fr; }
    :where(.od-tile) > :where(*) { display: block; }

    /* media keeps its intrinsic ratio by default; never a distorted or cropped
       cover by accident. height:auto lets the ratio win over an <img height="…">
       attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
       AND add .od-media-cover together (per the core rule, only where a crop is
       deliberate — tile thumbs, decorative fills — never on full-frame content). */
    .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
    .od-media-cover { object-fit: cover; }

    /* data text only — authored copy is rewritten to its budget instead */
    .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .od-clamp-2 { -webkit-line-clamp: 2; }
    .od-clamp-3 { -webkit-line-clamp: 3; }
    .od-lines-2 { min-height: calc(2 * 1.4em); }
    .od-nowrap  { white-space: nowrap; }
    .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

    /* screen skeleton (optional): bars take their own space, the middle scrolls */
    .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
    .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

    /* horizontal rail: the next item peeks at the edge */
    .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
               padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
    .od-rail::-webkit-scrollbar { display: none; }
    :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
    :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

    .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
    .od-touch  { min-width: 44px; min-height: 44px; }
  }
  /* /OD-LAYOUT-PRIMITIVES v1 */
  </style>

    }
    if(name==='coverage-catalog'){
      const coverageName=get('catalog-name');if(data.coverages.some(c=>c.name.toLowerCase()===coverageName.toLowerCase()))return showFormError(form,'Esa entidad ya está en el catálogo.','catalog-name');
      const c={id:id('OS'),name:coverageName,active:true};data.coverages.push(c);addAudit('Martina Sosa','Entidad de cobertura creada',c.id);done('Entidad agregada','Ya se puede seleccionar en fichas de pacientes.');return
    }
    if(name==='charge'){
      const a=data.appointments.find(x=>x.id===get('charge-appointment'));if(!a)return showFormError(form,'Elegí un turno.');
      const amount=Number(get('charge-amount'));if(amount<0)return showFormError(form,'El importe no puede ser negativo.','charge-amount');
      const c={id:id('COB'),appointmentId:a.id,patientId:a.patientId,amount,method:get('charge-method'),status:get('charge-result'),date:dateOffset(0)};data.charges.push(c);addAudit('Martina Sosa',`Cobro ${c.status.toLowerCase()}`,c.id);
      if(c.status==='Aprobado')addNotice(a.patientId,'Factura disponible',`El cobro presencial ${c.id} fue aprobado. Ya podés consultar la factura simulada.`,'Enviado',3);
      done(c.status==='Aprobado'?'Cobro aprobado':'Cobro '+c.status.toLowerCase(),c.status==='Aprobado'?'La factura simulada ya está disponible.':'No se generó factura para este resultado.');return
    }
    if(name==='report'){
      if(get('report-from')>get('report-to'))return showFormError(form,'La fecha inicial debe ser anterior a la final.','report-from');
      ui.report=get('report-type');ui.reportFrom=get('report-from');ui.reportTo=get('report-to');render();flash('Filtros aplicados','El reporte muestra el período seleccionado.');return
    }
    if(name==='audit-filter'){
      ui.auditFilter=get('audit-query');render();return
    }
  };

  const openModal=(title,message,label,confirm,danger=false)=>{ui.modal={title,message,label,confirm,danger,returnFocus:document.activeElement};renderModal()};
  const closeModal=()=>{const previous=ui.modal?.returnFocus;ui.modal=null;renderModal();if(previous?.isConnected)previous.focus()};
  const downloadFile=(name,mime,content)=>{const url=URL.createObjectURL(new Blob([content],{type:mime}));const anchor=document.createElement('a');anchor.href=url;anchor.download=name;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};
  const ascii=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,' ');
  const pdfText=s=>ascii(s).replace(/[\\()]/g,'\\$&');
  const makePdf=lines=>{
    const body=['BT','/F1 18 Tf',`1 0 0 1 50 780 Tm (${pdfText(lines[0]||'SIGSAM')}) Tj`,'/F1 11 Tf',...lines.slice(1,28).map((line,i)=>`1 0 0 1 50 ${744-i*23} Tm (${pdfText(line)}) Tj`),'ET'].join('\n');
    const objs=[
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
      `<< /Length ${body.length} >>\nstream\n${body}\nendstream`
    ];
    let pdf='%PDF-1.4\n';const offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=pdf.length;
    pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n${offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return pdf;
  };
  const xml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  const makeExcel=rows=>`<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="SIGSAM"><Table>${rows.map(row=>`<Row>${row.map(cell=>`<Cell><Data ss:Type="String">${xml(cell)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet></Workbook>`;
  const reportRows=()=>{
    const n=reportNumbers();const title={ocupacion:'Ocupación',asistencia:'Asistencia',inventario:'Inventario',cobros:'Cobros'}[ui.report];
    if(ui.report==='inventario')return [['Vacuna','Dosis físicas','Dosis comprometidas'],...data.vaccines.map(v=>[v.name,String(stock(v.id)),String(reserved(v.id))])];
    if(ui.report==='cobros')return [['Cobro','Paciente','Importe ARS','Estado'],...data.charges.filter(c=>inReportRange(c.date)).map(c=>[c.id,patientName(c.patientId),String(c.amount),c.status])];
    if(ui.report==='asistencia')return [['Indicador','Cantidad'],['Atendidos',String(n.attended)],['Ausentes',String(n.absent)],['Turnos confirmados',String(n.appointments)]];
    return [['Indicador','Cantidad'],['Turnos confirmados',String(n.appointments)],['Atendidos',String(n.attended)],['Cobros aprobados',String(n.charges)]];
  };
  const exportReport=(format,doctorOnly=false)=>{
    const rows=doctorOnly?[['Turno','Fecha','Paciente','Resultado'],...data.appointments.filter(a=>a.type==='medical'&&a.doctorId===currentDoctorId()).map(a=>[a.id,fmtDate(a.date),patientName(a.patientId),a.result])]:reportRows();
    if(rows.length<2){flash('Sin datos para exportar','Cambiá los filtros o registrá actividad antes de descargar.');return}
    const name=doctorOnly?'SIGSAM_medico':'SIGSAM_reporte_'+ui.report;
    if(format==='pdf')downloadFile(name+'.pdf','application/pdf',makePdf([doctorOnly?'SIGSAM - Datos propios':'SIGSAM - Reporte '+ui.report,...rows.map(row=>row.join(' | '))]));
    else downloadFile(name+'.xls','application/vnd.ms-excel',makeExcel(rows));
    flash('Exportación iniciada','Se descargó un archivo de demostración generado en el navegador.');
  };
  const downloadInvoice=appointmentId=>{
    const c=data.charges.slice().reverse().find(x=>x.appointmentId===appointmentId&&x.status==='Aprobado');
    if(!c){flash('Factura no disponible','Necesitás un cobro presencial aprobado.');return}
    const a=data.appointments.find(x=>x.id===appointmentId);
    downloadFile(`SIGSAM_factura_${c.id}.pdf`,'application/pdf',makePdf(['SIGSAM - Factura simulada',`Comprobante ${c.id}`,`Fecha: ${fmtDate(c.date)}`,`Paciente: ${patientName(c.patientId)}`,`Prestacion: ${appointmentName(a)}`,`Turno: ${appointmentId}`,`Importe: ARS ${c.amount}`,`Medio: ${c.method}`,'Documento de demostracion sin validez fiscal']));
    flash('Factura descargada','Este PDF es un comprobante simulado de la demo.');
  };
  const cancelAppointment=(appointmentId,admin=false)=>{
    const a=data.appointments.find(x=>x.id===appointmentId);
    if(!a||a.status!=='Confirmado')return flash('Turno no disponible','La reserva ya no se puede cancelar.');
    if(!admin&&hoursUntil(a)<24)return flash('Fuera de plazo','Faltan menos de 24 horas. Contactá a la sala para gestionar el turno.');
    openModal('Cancelar turno',`Se cancelará ${a.id} del ${fmtDate(a.date)} a las ${a.time}. El horario quedará libre.`,'Sí, cancelar',()=>{
      a.status='Cancelado';addNotice(a.patientId,'Turno cancelado',`El turno ${a.id} fue cancelado.`, 'Enviado',2);addAudit(admin?'Martina Sosa':patientName(a.patientId),'Turno cancelado',a.id);done('Turno cancelado','El cupo quedó libre y el aviso interno se conservó.');
    },true);
  };
  const markAbsent=(appointmentId,vaccine=false)=>{
    const a=data.appointments.find(x=>x.id===appointmentId);if(!a||a.result!=='Sin registrar')return flash('Resultado ya registrado','El turno ya tiene un resultado asistencial.');
    openModal('Registrar ausencia',`El resultado de ${a.id} será Ausente. La reserva seguirá identificada por separado.`,'Registrar ausencia',()=>{a.result='Ausente';addAudit(userName(),'Ausencia registrada',a.id);done('Ausencia registrada','El resultado asistencial se actualizó sin cambiar el estado de reserva.');},true);
  };
  const handleAction=(action,element)=>{
    const ref=element?.dataset.id;
    switch(action){
      case 'toggle-review':ui.review=!ui.review;render();break;
      case 'toggle-fidelity':ui.fidelity=ui.fidelity==='final'?'wireframe':'final';render();break;
      case 'variant-normal':ui.variant='Normal';render();break;
      case 'go-search':go('SC-05');break;
      case 'go-inventory':ui.role='enfermeria';go('SC-18');break;
      case 'signout':addAudit(userName(),'Cierre de sesión',ui.role);save();ui.role='publico';go('SC-01');flash('Sesión cerrada','Podés volver a ingresar cuando quieras.');break;
      case 'reset-demo':openModal('Restablecer datos de demostración','Se eliminarán los cambios locales de esta demo y volverán los datos de ejemplo.','Restablecer',()=>{data=seed();ui.role='paciente';ui.scope=projectScope;ui.latestAccount=null;ui.selectedPatient='PAC-01';ui.selectedAppointment='T-2048';ui.selectedSlot=null;save();go('SC-04');flash('Demo restablecida','Se cargaron los datos iniciales.')},true);break;
      case 'choose-medical-date':ui.search.date=element.dataset.date;render();break;
      case 'choose-medical-slot':if(medicalSlots(element.dataset.date,ui.search.doctor).find(s=>s.time===element.dataset.time)?.busy)return flash('Cupo tomado','Elegí un horario disponible.');ui.selectedSlot={date:element.dataset.date,time:element.dataset.time,doctorId:ui.search.doctor||'MED-01'};ui.holdUntil=Date.now()+5*60*1000;go('SC-06');break;
      case 'cancel-appointment':cancelAppointment(ref,false);break;
      case 'admin-cancel':cancelAppointment(ref,true);break;
      case 'mark-absent':markAbsent(ref,false);break;
      case 'mark-vaccine-absent':markAbsent(ref,true);break;
      case 'open-consult':ui.selectedAppointment=ref;go('SC-15');break;
      case 'open-correction':ui.selectedAppointment=ref;go('SC-16');break;
      case 'open-application':ui.selectedAppointment=ref;go('SC-19');break;
      case 'select-reprogram':ui.selectedAppointment=ref;render();document.querySelector('[name="reprogram-appointment"]')?.focus();break;
      case 'reset-account':{
        if(ui.role!=='admin')return flash('Sin permiso','Solo Administración puede generar una clave temporal.');
        const account=data.staff.find(x=>x.id===ref)||data.patients.find(x=>x.id===ref);
        if(!account?.email)return flash('Cuenta no disponible','Los menores ingresan mediante la cuenta de su tutor.');
        openModal('Generar clave temporal',`Administración entregará una nueva clave temporal a ${account.name}. La anterior dejará de funcionar.`,'Generar clave',()=>{account.temp=true;account.password='temporal123';ui.latestAccount={kind:account.role?'staff':'patient',name:account.name,email:account.email,password:account.password};addAudit(userName(),'Clave temporal generada',account.id);done('Clave temporal generada',`Entregá la nueva clave a ${account.name}. El cambio será obligatorio al ingresar.`)});break
      }
      case 'deactivate-staff':{const s=data.staff.find(x=>x.id===ref);if(!s)return;openModal('Desactivar cuenta',`${s.name} perderá acceso. Sus registros se conservan.`,'Desactivar',()=>{s.active=false;addAudit('Martina Sosa','Cuenta desactivada',s.id);done('Cuenta desactivada','La historia vinculada permanece disponible.')},true);break}
      case 'toggle-coverage':{const c=byCoverage(ref);if(!c)return;openModal(c.active?'Desactivar entidad':'Activar entidad',c.active?`${c.name} dejará de ofrecerse en nuevas afiliaciones. El historial no se borra.`:`${c.name} volverá a estar disponible para nuevas afiliaciones.`,c.active?'Desactivar':'Activar',()=>{c.active=!c.active;addAudit('Martina Sosa',c.active?'Entidad activada':'Entidad desactivada',c.id);done('Catálogo actualizado','El cambio se refleja en las opciones de cobertura.')},c.active);break}
      case 'read-notice':{const n=data.notices.find(x=>x.id===ref);if(n){n.read=true;done('Aviso leído','La bandeja se actualizó.')}break}
      case 'read-all':{const owner=ui.role==='paciente'?ui.selectedPatient:ui.role==='medico'?currentDoctorId():ui.role==='enfermeria'?'ENF-01':'ADM-01';data.notices.filter(n=>n.for===owner).forEach(n=>n.read=true);done('Avisos actualizados','Todos se marcaron como leídos.');break}
      case 'download-invoice':downloadInvoice(ref);break;
      case 'export-pdf':exportReport('pdf');break;
      case 'export-excel':exportReport('xls');break;
      case 'export-doctor':exportReport('xls',true);break;
      case 'close-modal':closeModal();break;
      case 'confirm-modal':{const confirm=ui.modal?.confirm;ui.modal=null;renderModal();if(confirm)confirm();break}
    }
  };

  document.addEventListener('click',event=>{
    ui.lastActivity=Date.now();
    const nav=event.target.closest('[data-nav]');
    if(nav){event.preventDefault();const screen=nav.dataset.nav;const meta=byId[screen];if(nav.closest('.review-panel')&&meta&&meta.role!=='all'&&meta.role!=='publico')ui.role=meta.role;go(screen);return}
    const scope=event.target.closest('[data-scope]');
    if(scope){ui.scope=Number(scope.dataset.scope);ui.variant='Normal';if(byId[ui.screen]?.sprint>ui.scope)go(roleHome[ui.role]||'SC-01');else render();return}
    const variant=event.target.closest('[data-variant]');
    if(variant){ui.variant=variant.dataset.variant;render();return}
    const action=event.target.closest('[data-action]');if(action)handleAction(action.dataset.action,action);
  });
  document.addEventListener('submit',event=>{
    const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();ui.lastActivity=Date.now();submitForm(form);
  });
  document.addEventListener('change',event=>{
    ui.lastActivity=Date.now();const el=event.target;
    if(el.matches('[data-review-role]')){ui.role=el.value;ui.activeStaffId=data.staff.find(s=>s.role===ui.role&&s.active)?.id||ui.activeStaffId;ui.variant='Normal';go(ui.role==='publico'?'SC-01':roleHome[ui.role]);return}
    if(el.name==='vac-date'){ui.vaccineDate=el.value;render();return}
    if(el.name==='vac-vaccine'){ui.vaccineId=el.value;render();return}
    if(el.name==='consult-appointment'||el.name==='apply-appointment'||el.name==='reprogram-appointment'){ui.selectedAppointment=el.value;render();return}
    if(el.name==='correction-note'){const n=data.notes.find(x=>x.id===el.value);if(n)ui.selectedAppointment=n.appointmentId;render();return}
    if(el.name==='overbook-slot'){const a=data.appointments.find(x=>x.id===el.value);if(a)ui.overbookDate=a.date;render()}
  });
  document.addEventListener('focusout',event=>{
    const el=event.target;if(!el.matches('form input,form select,form textarea'))return;
    if(el.type==='hidden'||!el.name)return;
    const err=el.closest('.field')?.querySelector('.field-error');
    if(!el.checkValidity()){el.setAttribute('aria-invalid','true');if(err)err.textContent=el.validity.valueMissing?'Este campo es obligatorio.':'Ingresá un valor válido.'}
    else{el.removeAttribute('aria-invalid');if(err)err.textContent=''}
  },true);
  document.addEventListener('keydown',event=>{
    ui.lastActivity=Date.now();
    if(event.key==='Escape'&&ui.modal){event.preventDefault();closeModal()}
    if(event.altKey&&event.key.toLowerCase()==='r'){event.preventDefault();ui.review=!ui.review;render()}
  });
  window.addEventListener('popstate',()=>{const route=location.hash.slice(1);ui.screen=byId[route]?route:'SC-04';ui.variant='Normal';render();window.scrollTo(0,ui.scroll[ui.screen]||0)});
  window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(route&&route!==ui.screen){ui.screen=route;ui.variant='Normal';render()}});
  setInterval(()=>{
    const clock=document.querySelector('[data-hold-clock]');
    if(clock){const seconds=Math.max(0,Math.ceil((ui.holdUntil-Date.now())/1000));clock.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds===0&&ui.screen==='SC-06'){ui.variant='Retención vencida';render()}}
    if(ui.role!=='publico'&&Date.now()-ui.lastActivity>15*60*1000){addAudit(userName(),'Sesión cerrada por inactividad',ui.role);save();ui.role='publico';ui.lastActivity=Date.now();go('SC-01');flash('Sesión finalizada','Pasaron 15 minutos sin actividad. Volvé a ingresar.')}
  },1000);
  render();
})();

</script>
</body>
</html>
